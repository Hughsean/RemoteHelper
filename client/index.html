<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务监控(Hughsean)</title>
</head>

<body
  class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col animate-fade-in selection:bg-indigo-500/30 selection:text-indigo-200">
  <!-- Header -->
  <header
    class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/50 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20 transition-transform hover:scale-105 hover:rotate-3">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
          </path>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">
        服务监控(Hughsean)
      </h1>
    </div>
    <div class="flex items-center gap-3">
      <div
        class="relative bg-slate-800/50 rounded-lg border border-slate-700 hover:border-slate-600 transition-all duration-300 group w-40 hover:bg-slate-800">
        <div class="flex items-center justify-between px-3 py-1.5 pointer-events-none h-full">
          <span class="text-xs text-slate-400 group-hover:text-slate-300 transition-colors">刷新间隔</span>
          <div class="flex items-center gap-1">
            <span id="refresh-display" class="text-sm text-white font-medium">3s</span>
            <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition-colors" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>
        <select id="refresh-interval"
          class="absolute inset-0 w-full h-full opacity-0 cursor-pointer [&>option]:bg-slate-800 [&>option]:text-slate-200">
          <option value="100">0.1s</option>
          <option value="500">0.5s</option>
          <option value="1000" selected>1s</option>
          <option value="3000">3s</option>
          <option value="10000">10s</option>
          <option value="custom">自定义...</option>
          <option value="0">暂停</option>
        </select>
      </div>
      <button onclick="refreshAll()"
        class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white hover:border-slate-500 transition-all duration-200 text-sm font-medium active:scale-95 active:bg-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
          </path>
        </svg>
        立即刷新
      </button>
      <button onclick="quitApp()"
        class="flex items-center justify-center w-9 h-9 rounded-lg border border-slate-600 text-slate-300 hover:bg-rose-900/30 hover:text-rose-400 hover:border-rose-800 transition-all duration-200 active:scale-95"
        title="退出应用">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
          </path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-6 overflow-y-auto flex flex-col">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full flex-1">
      <!-- Left Column: Service Control -->
      <div class="lg:col-span-5 flex flex-col gap-6 h-full">
        <div class="glass-panel rounded-xl overflow-hidden flex flex-col h-full hover-card">
          <div class="p-5 border-b border-slate-800/50 flex justify-between items-center bg-slate-900/30">
            <h2 class="font-semibold text-white flex items-center gap-2">
              <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01">
                </path>
              </svg>
              服务管理
            </h2>
            <div class="relative group flex gap-2">
              <div class="relative">
                <input type="text" id="server-address" placeholder="服务器地址" value="frp-try.com:61670"
                  class="bg-slate-950/50 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 block w-48 pl-9 p-2 placeholder-slate-500 transition-all duration-300 hover:border-slate-600"
                  onchange="authenticate()" />
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                  <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-400 transition-colors" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                    </path>
                  </svg>
                </div>
              </div>
              <div class="relative">
                <input type="password" id="auth-token" placeholder="在此输入私钥口令"
                  class="bg-slate-950/50 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 block w-64 pl-10 p-2 placeholder-slate-500 transition-all duration-300 hover:border-slate-600"
                  onchange="authenticate()" />
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                  <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-400 transition-colors" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11.536 11l-.993.993a1 1 0 00-.293.707v1.414a1 1 0 00.293.707l1.414 1.414a1 1 0 00.707.293h1.414a1 1 0 00.707-.293l.993-.993A6 6 0 0121 9zM7 11V7a5 5 0 0110 0v4">
                    </path>
                  </svg>
                </div>
                <div id="auth-status-indicator" class="absolute inset-y-0 right-0 flex items-center pr-3">
                  <!-- Status icon will be injected here -->
                </div>
              </div>
            </div>
          </div>

          <div class="flex-1 overflow-x-auto">
            <table class="w-full text-sm text-left text-slate-400">
              <thead class="text-xs text-slate-400 uppercase bg-slate-950/30 border-b border-slate-800/50">
                <tr>
                  <th scope="col" class="px-6 py-3 font-medium">ID</th>
                  <th scope="col" class="px-6 py-3 font-medium">描述</th>
                  <th scope="col" class="px-6 py-3 font-medium">状态</th>
                  <th scope="col" class="px-6 py-3 font-medium text-right">
                    操作
                  </th>
                </tr>
              </thead>
              <tbody id="service-list-body" class="divide-y divide-slate-800/50">
                <!-- Rows will be populated by JS -->
                <tr>
                  <td colspan="4" class="px-6 py-8 text-center text-slate-500 animate-pulse-soft">
                    请先输入密钥并连接服务器...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="p-5 border-t border-slate-800/50 bg-slate-900/30 flex flex-col gap-3">
            <div class="grid grid-cols-2 gap-4">
              <button onclick="controlAll('start')"
                class="flex items-center justify-center gap-2 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-lg transition-all duration-200 shadow-lg shadow-emerald-900/20 active:scale-95 active:shadow-none hover:shadow-emerald-500/20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                  </path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                全部启动
              </button>
              <button onclick="controlAll('stop')"
                class="flex items-center justify-center gap-2 w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 px-4 rounded-lg transition-all duration-200 shadow-lg shadow-rose-900/20 active:scale-95 active:shadow-none hover:shadow-rose-500/20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z">
                  </path>
                </svg>
                全部停止
              </button>
            </div>
            <button onclick="openAddServiceModal()"
              class="flex items-center justify-center gap-2 w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 border border-slate-600 hover:border-slate-500 active:scale-95">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              添加临时服务
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column: System Status -->
      <div class="lg:col-span-7 flex flex-col gap-6 h-full">
        <div class="glass-panel rounded-xl p-6 hover-card">
          <h2 class="font-semibold text-white mb-6 flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
              </path>
            </svg>
            系统状态
          </h2>

          <div class="space-y-6">
            <!-- CPU -->
            <div>
              <div class="flex justify-between mb-2">
                <div class="flex flex-col">
                  <span class="text-sm font-medium text-slate-400">CPU 使用率</span>
                  <span id="cpu-model" class="text-xs text-slate-500 h-4"></span>
                </div>
                <span id="cpu-val" class="text-sm font-bold text-white">--%</span>
              </div>
              <div class="w-full bg-slate-800/50 rounded-full h-2.5 overflow-hidden">
                <div id="cpu-bar"
                  class="bg-blue-500 h-2.5 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(59,130,246,0.5)]"
                  style="width: 0%">
                </div>
              </div>
            </div>

            <!-- Memory -->
            <div>
              <div class="flex justify-between mb-2">
                <span class="text-sm font-medium text-slate-400">内存使用率</span>
                <span id="mem-val" class="text-sm font-bold text-white">-- / --</span>
              </div>
              <div class="w-full bg-slate-800/50 rounded-full h-2.5 overflow-hidden">
                <div id="mem-bar"
                  class="bg-indigo-500 h-2.5 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(99,102,241,0.5)]"
                  style="width: 0%"></div>
              </div>
            </div>

            <!-- GPU (Placeholder) -->
            <div>
              <div class="flex justify-between mb-2">
                <div class="flex flex-col">
                  <span class="text-sm font-medium text-slate-400">GPU 状态</span>
                  <span id="gpu-model" class="text-xs text-slate-500 h-4"></span>
                </div>
                <span id="gpu-val" class="text-sm font-bold text-white">N/A</span>
              </div>
              <div class="w-full bg-slate-800/50 rounded-full h-2.5 overflow-hidden">
                <div id="gpu-bar"
                  class="bg-purple-500 h-2.5 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(168,85,247,0.5)]"
                  style="width: 0%"></div>
              </div>
            </div>

            <!-- Uptime -->
            <div class="pt-4 border-t border-slate-800/50 flex justify-between items-center">
              <span class="text-sm text-slate-500">运行时间</span>
              <span id="uptime-val" class="text-sm font-mono text-emerald-400">--:--:--</span>
            </div>
          </div>
        </div>

        <!-- Performance Trend -->
        <div class="glass-panel rounded-xl p-6 flex-1 flex flex-col hover-card">
          <div class="flex justify-between items-center mb-4 cursor-pointer group" onclick="toggleChart()">
            <h2 class="font-semibold text-white flex items-center gap-2 group-hover:text-indigo-300 transition-colors">
              <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
              </svg>
              性能趋势
            </h2>
            <svg id="chart-chevron" class="w-5 h-5 text-slate-500 transform transition-transform group-hover:text-white"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
          <div id="chart-container" class="flex-1 min-h-[200px] relative transition-all duration-500 ease-in-out">
            <canvas id="perfChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Service Modal -->
  <div id="add-service-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeAddServiceModal()">
    </div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div
        class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md transform transition-all scale-100">
        <div class="p-6 space-y-4">
          <h3 class="text-lg font-semibold text-white flex items-center gap-2">
            <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
              </path>
            </svg>
            添加临时服务
          </h3>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">服务描述</label>
              <input type="text" id="new-svc-desc"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                placeholder="例如: My Web Server">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">可执行文件路径</label>
              <input type="text" id="new-svc-path"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                placeholder="C:\Path\To\app.exe">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">参数 (可选, 空格分隔)</label>
              <input type="text" id="new-svc-args"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                placeholder="-c config.json">
            </div>
          </div>
          <div class="flex justify-end gap-3 pt-2">
            <button onclick="closeAddServiceModal()"
              class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">取消</button>
            <button onclick="confirmAddService()"
              class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-lg shadow-indigo-900/20 transition-all active:scale-95">添加</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
