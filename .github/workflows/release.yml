name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            🎉 RemoteHelper 新版本发布！

            ### ✨ 核心特性

            - 🔒 **端到端加密通信** (X25519 + AES-256-GCM)
            - 🔑 **Ed25519 公钥认证** - 无需密码，更安全
            - 📊 **实时硬件监控** - CPU、内存、GPU、网络流量
            - 🚀 **进程管理** - 启动/停止/重启外部程序
            - 💻 **双客户端支持** - Web 界面 + Tauri 桌面应用
            - 📝 **自动日志轮转** - 10MB 阈值
            - ⚙️ **可配置连接限制和超时**

            ### 📦 下载说明

            #### 服务器端 (Server)
            - **Windows (x64)**: RemoteHelperServer-x86_64-pc-windows-msvc.zip
            - **macOS (Intel)**: RemoteHelperServer-x86_64-apple-darwin.tar.gz
            - **macOS (Apple Silicon)**: RemoteHelperServer-aarch64-apple-darwin.tar.gz

            #### 桌面客户端 (Client)
            - **Windows**: RemoteHelper_..._x64-setup.exe / .msi
            - **macOS**: RemoteHelper_..._x64.dmg / _aarch64.dmg

            ### 🚀 快速开始

            1. **生成密钥**: 运行 keygen 生成 ~/id_ed25519.json
            2. **配置**: 将公钥填入 config.toml 的 authorized_keys
            3. **启动**: 运行 RemoteHelperServer
            4. **连接**: 使用客户端连接

  build-server:
    name: Build Server
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build server binaries
        run: |
          cargo build --release --target ${{ matrix.target }} --bin RemoteHelperServer
          cargo build --release --target ${{ matrix.target }} --bin keygen
          cargo build --release --target ${{ matrix.target }} --bin gen_cert
          cargo build --release --target ${{ matrix.target }} --bin test_real_ip

      - name: Package release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $name = "RemoteHelperServer-${{ matrix.target }}"
          mkdir $name
          cp target/${{ matrix.target }}/release/RemoteHelperServer${{ matrix.ext }} $name/
          cp target/${{ matrix.target }}/release/keygen${{ matrix.ext }} $name/
          cp target/${{ matrix.target }}/release/gen_cert${{ matrix.ext }} $name/
          cp target/${{ matrix.target }}/release/test_real_ip${{ matrix.ext }} $name/
          cp config.toml $name/config.example.toml
          cp README.md $name/
          cp LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Package release (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          NAME="RemoteHelperServer-${{ matrix.target }}"
          mkdir $NAME
          cp target/${{ matrix.target }}/release/RemoteHelperServer $NAME/
          cp target/${{ matrix.target }}/release/keygen $NAME/
          cp target/${{ matrix.target }}/release/gen_cert $NAME/
          cp target/${{ matrix.target }}/release/test_real_ip $NAME/
          cp config.toml $NAME/config.example.toml
          cp README.md $NAME/
          cp LICENSE $NAME/
          tar czf "$NAME.tar.gz" $NAME

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./RemoteHelperServer-${{ matrix.target }}.${{ matrix.archive }}

  build-tauri:
    name: Build Tauri Client
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.6"

      - name: Build and Upload Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: "./app"
          args: ${{ matrix.args }}

  publish-crate:
    name: Publish to crates.io
    needs: [build-server, build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish common
        run: cargo publish -p common --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true

      - name: Wait for common
        run: sleep 30

      - name: Publish client
        run: cargo publish -p client --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true
