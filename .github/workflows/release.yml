name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            🎉 RemoteHelper 首个正式版本发布！这是一个专为 Windows 设计的系统监控和远程管理工具，提供端到端加密通信和实时硬件监控。

            ### ✨ 核心特性

            - 🔒 **端到端加密通信** (X25519 + AES-256-GCM)
            - 🔑 **Ed25519 公钥认证** - 无需密码，更安全
            - 📊 **实时硬件监控** - CPU、内存、GPU、网络流量
            - 🚀 **进程管理** - 启动/停止/重启外部程序
            - 💻 **双客户端支持** - Web 界面 + Tauri 桌面应用
            - 📝 **自动日志轮转** - 10MB 阈值
            - ⚙️ **可配置连接限制和超时**

            ### 📦 下载

            #### 服务器端
            - **Windows (x64)**: `RemoteHelperServer-x86_64-pc-windows-msvc.zip`
            - **macOS (Intel)**: `RemoteHelperServer-x86_64-apple-darwin.tar.gz`
            - **macOS (Apple Silicon)**: `RemoteHelperServer-aarch64-apple-darwin.tar.gz`

            #### 桌面客户端
            - **Windows**: `RemoteHelper-*.msi` (MSI 安装包)
            - **macOS**: `RemoteHelper-*.dmg` (DMG 镜像)

            #### 工具集
            所有平台的服务器压缩包均包含：
            - `keygen` - 密钥对生成工具
            - `gen_cert` - 证书生成工具
            - `test_real_ip` - 认证测试工具

            ### 🚀 快速开始

            **1. 生成密钥对**
            ```bash
            # Windows
            .\keygen.exe

            # macOS/Linux
            ./keygen
            ```
            密钥将保存到 `~/id_ed25519.json`

            **2. 配置服务器**
            编辑 `config.toml`，将公钥添加到 `authorized_keys`

            **3. 启动服务器**
            ```bash
            # Windows
            .\RemoteHelperServer.exe

            # macOS/Linux
            ./RemoteHelperServer
            ```

            **4. 连接客户端**
            - 启动桌面客户端或访问 Web 界面
            - 输入服务器地址和密钥密码
            - 开始监控！

            ### 🔐 安全性

            - X25519 Diffie-Hellman 密钥交换
            - AES-256-GCM 对称加密
            - Ed25519 数字签名
            - PBKDF2 密钥派生
            - 30 秒挑战过期时间
            - 每消息唯一随机数
            - 连接限制 DoS 防护

            ### 📚 文档

            - [README.md](https://github.com/Hughsean/RemoteHelper/blob/main/README.md) - 完整文档
            - [CHANGELOG.md](https://github.com/Hughsean/RemoteHelper/blob/main/CHANGELOG.md) - 变更日志
            - [CONTRIBUTING.md](https://github.com/Hughsean/RemoteHelper/blob/main/CONTRIBUTING.md) - 贡献指南

            ### ⚠️ 注意事项

            - 首次运行必须先使用 `keygen` 生成密钥对
            - GPU 监控仅支持 NVIDIA 显卡（需要驱动）
            - macOS 版本可能需要在"系统设置 > 隐私与安全性"中允许运行

            ### 🐛 问题反馈

            如遇到问题，请在 [Issues](https://github.com/Hughsean/RemoteHelper/issues) 中提交

            ### 📄 许可证

            MIT License - 详见 [LICENSE](https://github.com/Hughsean/RemoteHelper/blob/main/LICENSE)

  build-release:
    name: Build Release
    needs: create-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --target ${{ matrix.target }} --bin RemoteHelperServer

      - name: Build utilities
        run: |
          cargo build --release --target ${{ matrix.target }} --bin keygen
          cargo build --release --target ${{ matrix.target }} --bin gen_cert
          cargo build --release --target ${{ matrix.target }} --bin test_real_ip

      - name: Package release (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir RemoteHelperServer-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/RemoteHelperServer${{ matrix.ext }} RemoteHelperServer-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/keygen${{ matrix.ext }} RemoteHelperServer-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/gen_cert${{ matrix.ext }} RemoteHelperServer-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/test_real_ip${{ matrix.ext }} RemoteHelperServer-${{ matrix.target }}/
          cp config.toml RemoteHelperServer-${{ matrix.target }}/config.example.toml
          cp README.md RemoteHelperServer-${{ matrix.target }}/
          cp LICENSE RemoteHelperServer-${{ matrix.target }}/
          Compress-Archive -Path RemoteHelperServer-${{ matrix.target }} -DestinationPath RemoteHelperServer-${{ matrix.target }}.zip

      - name: Package release (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir RemoteHelperServer-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/RemoteHelperServer RemoteHelperServer-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/keygen RemoteHelperServer-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/gen_cert RemoteHelperServer-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/test_real_ip RemoteHelperServer-${{ matrix.target }}/
          cp config.toml RemoteHelperServer-${{ matrix.target }}/config.example.toml
          cp README.md RemoteHelperServer-${{ matrix.target }}/
          cp LICENSE RemoteHelperServer-${{ matrix.target }}/
          tar czf RemoteHelperServer-${{ matrix.target }}.tar.gz RemoteHelperServer-${{ matrix.target }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./RemoteHelperServer-${{ matrix.target }}.${{ matrix.archive }}
          asset_name: RemoteHelperServer-${{ matrix.target }}.${{ matrix.archive }}
          asset_content_type: ${{ matrix.archive == 'zip' && 'application/zip' || 'application/gzip' }}

  build-tauri-release:
    name: Build Tauri Release
    needs: create-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli

      - name: Build Dioxus app
        working-directory: app
        run: dx build --release

      - name: Build Tauri app
        working-directory: app
        run: cargo tauri build

      - name: Find and Upload Windows MSI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path app/src-tauri/target/release/bundle/msi -Filter "*.msi" | Select-Object -First 1
          echo "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV
          echo "MSI_NAME=$($msi.Name)" >> $env:GITHUB_ENV

      - name: Upload Windows MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.MSI_PATH }}
          asset_name: ${{ env.MSI_NAME }}
          asset_content_type: application/x-msi

      - name: Find and Upload macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          DMG_PATH=$(find app/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          DMG_NAME=$(basename "$DMG_PATH")
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.DMG_PATH }}
          asset_name: ${{ env.DMG_NAME }}
          asset_content_type: application/x-apple-diskimage

  publish-crate:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish common
        run: cargo publish -p common --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true

      - name: Wait for common to be available
        run: sleep 30

      - name: Publish client
        run: cargo publish -p client --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true
