name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            Windows 与 macOS 原生桌面客户端基于 GPUI Kit 构建。
            在仓库根目录运行 `cargo run -p App` 启动开发版本。

  build-client:
    name: Build native client (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build client
        run: cargo build --release -p App --target ${{ matrix.target }}

      - name: Package Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/App.exe" "dist/RemoteHelper-${{ matrix.target }}.exe"

      - name: Package macOS client
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          bundle="dist/staging/RemoteHelper.app"
          mkdir -p "$bundle/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/App" "$bundle/Contents/MacOS/RemoteHelper"
          cat > "$bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>RemoteHelper</string>
            <key>CFBundleIdentifier</key><string>dev.hughsean.remotehelper</string>
            <key>CFBundleName</key><string>RemoteHelper</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>LSMinimumSystemVersion</key><string>15.0</string>
          </dict>
          </plist>
          PLIST
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" "$bundle/Contents/Info.plist"
          plutil -lint "$bundle/Contents/Info.plist"
          codesign --force --sign - "$bundle"
          ln -s /Applications dist/staging/Applications
          hdiutil create -volname RemoteHelper -srcfolder dist/staging -format UDZO \
            "dist/RemoteHelper-${{ matrix.target }}.dmg"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: dist/RemoteHelper-${{ matrix.target }}.*
