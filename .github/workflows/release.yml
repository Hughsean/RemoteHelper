name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            🎉 RemoteHelper v2.2.0 - 重大功能更新

            ### ✨ 新功能
            - **用户模式支持**: 新增完整的用户凭据管理系统
              - 支持多用户凭据存储和管理
              - 安全的凭据加密存储机制
            - **UI/UX 全面升级**:
              - 新增登录视图和仪表板视图
              - 重构应用状态管理，采用更现代的状态管理模式
              - 新增顶部导航栏、凭据管理模态框、服务添加模态框
              - 优化服务列表、系统状态卡片等组件样式
            - **macOS 原生体验增强**:
              - 添加自定义中文菜单支持
              - 优化窗口大小和标题样式
              - 更新包名称为 RemoteHelperApp

            ### 🔧 改进
            - 重构路由系统，支持登录/仪表板视图切换
            - 优化样式文件结构（模块化 CSS）
            - 改进滚动条行为和视觉效果
            - 更新默认服务器地址为 `frp-try.com:53460`

            ### 🚀 快速开始

            **首次使用**
            1. **生成密钥**: `cargo run --bin keygen`
            2. **配置**: 将公钥填入 `config.toml` 的 `authorized_keys`
            3. **启动服务端**: `cargo run --bin RemoteHelperServer`
            4. **启动客户端**: `cd app && cargo tauri dev`

            **升级用户**
            - ⚠️ 本版本包含 UI 重构，首次启动可能需要重新登录
            - 与 v2.1.x 完全兼容，无需更改服务端配置
            - 新增凭据管理功能，可管理多个服务器连接

  build-dioxus:
    name: Build Dioxus Desktop Client
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            bundle_extension: "dmg"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            bundle_extension: "dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app -> target"

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7"

      - name: Build Dioxus Desktop App
        working-directory: ./app
        run: dx bundle --release --target ${{ matrix.target }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/bundle/**/*.${{ matrix.bundle_extension }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
