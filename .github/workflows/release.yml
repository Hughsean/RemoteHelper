name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            🚀 RemoteHelper v2.1.0 - 架构优化与性能提升

            ### ⚠️ Breaking Changes

            **协议变更**
            - 移除 `nanoid` 依赖,`SystemInfo` 和 `ServiceInfo` 不再包含 `nanoid` 字段
            - `SystemInfo` 新增 `timestamp` 字段 (Unix 毫秒时间戳) 用于数据标识
            - 旧版客户端需要升级以兼容新协议

            ### ✨ 新特性

            **精确时间追踪**
            - 服务器端为每个状态响应生成精确的 Unix 毫秒时间戳
            - 客户端基于真实时间窗口管理历史数据 (30分钟滚动窗口)
            - 数据采集时间由服务器统一控制,避免客户端时钟差异

            ### ⚡ 性能优化

            **数据结构优化**
            - Web 客户端使用 `VecDeque` 替代 `Vec`,时间序列操作从 O(n) 优化至 O(1)
            - 历史数据清理策略从固定长度改为基于时间间隔
            - 减少频繁删除旧数据时的内存拷贝开销

            ### 🗑️ 移除内容

            - 移除 `nanoid` crate 依赖 (减少依赖树大小)
            - 移除 `common::func::nanoid_gen()` 函数
            - 移除客户端侧的 nanoid 生成和补全逻辑

            ### 📦 迁移指南

            **服务端**
            - 直接升级,无需配置更改
            - 自动生成时间戳字段

            **客户端**
            - Tauri/Web 客户端需同步升级
            - 移除对 `nanoid` 字段的引用
            - 使用 `timestamp` 进行时间相关操作

            ### 🚀 快速开始

            **首次使用**
            1. **生成密钥**: `cargo run --bin keygen`
            2. **配置**: 将公钥填入 `config.toml` 的 `authorized_keys`
            3. **启动服务端**: `cargo run --bin RemoteHelperServer`
            4. **启动客户端**: `cd app && cargo tauri dev`

            **升级用户**
            - 服务端和客户端需同时升级
            - 协议不向后兼容,旧版客户端无法连接新版服务器

  build-tauri:
    name: Build Tauri Client
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7"

      - name: Build and Upload Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: "./app"
          args: ${{ matrix.args }}
