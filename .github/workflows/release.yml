name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            🎉 RemoteHelper 新版本发布！

            ### ✨ 核心特性

            - 🔒 **端到端加密通信** (X25519 + AES-256-GCM)
            - 🔑 **Ed25519 公钥认证** - 无需密码，更安全
            - 📊 **实时硬件监控** - CPU、内存、GPU、网络流量
            - 🚀 **进程管理** - 启动/停止/重启外部程序
            - 💻 **双客户端支持** - Web 界面 + Tauri 桌面应用
            - 📝 **自动日志轮转** - 10MB 阈值
            - ⚙️ **可配置连接限制和超时**

            ### 📦 下载说明

            #### 桌面客户端 (Client)
            - **macOS**: RemoteHelper_..._aarch64.dmg

            ### 🚀 快速开始

            1. **生成密钥**: 运行 keygen 生成 ~/id_ed25519.json
            2. **配置**: 将公钥填入 config.toml 的 authorized_keys
            3. **启动**: 运行 RemoteHelperServer
            4. **连接**: 使用客户端连接

  build-tauri:
    name: Build Tauri Client
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7"

      - name: Build and Upload Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: "./app"
          args: ${{ matrix.args }}
