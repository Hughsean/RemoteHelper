name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            � RemoteHelper v2.0.1 - Bug 修复版本

            ### 🐛 Bug 修复

            **图表渲染修复**
            - 修复趋势图 X 轴基于数据点索引而非真实时间戳的问题
            - 图表现在根据真实时间间隔显示数据,而非刷新速率
            - 修改刷新间隔 (0.1s → 5s) 不再影响视觉滚动速度
            - 时间窗口 (1分钟/5分钟/30分钟) 现在准确反映实际时钟时间
            - 图表行为现在与 Windows 任务管理器一致 (基于时间的滚动)

            **macOS 全屏模式修复**
            - Tauri 应用从系统托盘显示窗口时现在会正确退出全屏模式
            - 防止窗口卡在无标题栏的全屏状态
            - 确保窗口以正常模式显示,带有正确的尺寸和位置
            - 适用于菜单项点击和托盘图标点击两种场景

            ### ⚡ 改进

            - 不同刷新速率设置下的用户体验更加一致
            - 图表数据点的水平位置准确反映真实时间间隔

            ### 🚀 快速开始

            **首次使用**
            1. **生成密钥**: `cargo run --bin keygen`
            2. **配置**: 将公钥填入 `config.toml` 的 `authorized_keys`
            3. **启动服务端**: `cargo run --bin RemoteHelperServer`
            4. **启动客户端**: `cd app && cargo tauri dev`

            **升级用户**
            - 推荐升级以获得更好的图表体验和 macOS 全屏支持
            - 与 v2.0.0 完全兼容,无需更改配置

  build-tauri:
    name: Build Tauri Client
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7"

      - name: Build and Upload Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: "./app"
          args: ${{ matrix.args }}
