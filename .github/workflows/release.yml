name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            🔄 RemoteHelper v2.0.1 - 密钥管理优化更新

            ### 🔑 重要变更（需要迁移）

            **密钥文件位置标准化**
            - 客户端私钥现在统一从 `~/id_ed25519.json` 自动加载
            - 不再需要在代码中硬编码密钥
            - `keygen` 工具现在直接保存到标准位置

            ### 🎨 界面优化

            - 优化应用标题布局，提升视觉层次感

            ### 📦 迁移指南

            如果你有现有的 `client_key.json`，请迁移到新位置：

            **Windows:**
            ```powershell
            Move-Item client_key.json $env:USERPROFILE\id_ed25519.json
            ```

            **Linux/macOS:**
            ```bash
            mv client_key.json ~/id_ed25519.json
            ```

            或生成新密钥对：
            ```bash
            cargo run --bin keygen
            ```

            ### 🚀 快速开始

            1. **生成密钥**: 运行 keygen 生成 ~/id_ed25519.json
            2. **配置**: 将公钥填入 config.toml 的 authorized_keys
            3. **启动**: 运行 RemoteHelperServer
            4. **连接**: 使用客户端连接

  build-tauri:
    name: Build Tauri Client
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7"

      - name: Build and Upload Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: "./app"
          args: ${{ matrix.args }}
