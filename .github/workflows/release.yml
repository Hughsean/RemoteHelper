name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle_version: ${{ steps.version.outputs.bundle_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Match the tag against the Cargo workspace
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          metadata=$(cargo metadata --no-deps --format-version 1)
          for package in App RemoteHelperServer; do
            expected=$(jq -er --arg package "$package" '.packages[] | select(.name == $package) | .version' <<< "$metadata")
            if [[ "$GITHUB_REF_NAME" != "v$expected" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match $package version $expected" >&2
              exit 1
            fi
          done
          without_build="${version%%+*}"
          prerelease=false
          if [[ "$without_build" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "bundle_version=${without_build%%-*}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build-packages:
    name: Build native packages (${{ matrix.target }})
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            packages: -p App -p RemoteHelperServer
          - platform: macos-15
            target: aarch64-apple-darwin
            packages: -p App

    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build native packages
        run: cargo build --release ${{ matrix.packages }} --target ${{ matrix.target }}

      - name: Prepare macOS app icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/icon.iconset dist/RemoteHelper.icns
          mkdir -p dist/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" crates/app/assets/icon.png \
              --out "dist/icon.iconset/icon_${size}x${size}.png" >/dev/null
            retina=$((size * 2))
            sips -z "$retina" "$retina" crates/app/assets/icon.png \
              --out "dist/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns dist/icon.iconset -o dist/RemoteHelper.icns

      - name: Package Windows client and server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targetDir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$targetDir/App.exe" "dist/RemoteHelper-${{ matrix.target }}.exe"
          Compress-Archive -Path @("$targetDir/RemoteHelperServer.exe", "$targetDir/keygen.exe", "config.example.toml", "LICENSE") `
            -DestinationPath "dist/RemoteHelperServer-${{ matrix.target }}.zip"

      - name: Package macOS client
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ needs.validate-tag.outputs.bundle_version }}
        shell: bash
        run: |
          bundle="dist/staging/RemoteHelper.app"
          mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
          cp "target/${{ matrix.target }}/release/App" "$bundle/Contents/MacOS/RemoteHelper"
          cp dist/RemoteHelper.icns "$bundle/Contents/Resources/RemoteHelper.icns"
          cat > "$bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleExecutable</key><string>RemoteHelper</string>
            <key>CFBundleIconFile</key><string>RemoteHelper.icns</string>
            <key>CFBundleIdentifier</key><string>dev.hughsean.remotehelper</string>
            <key>CFBundleName</key><string>RemoteHelper</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>CFBundleVersion</key><string>0.0.0</string>
            <key>LSMinimumSystemVersion</key><string>15.0</string>
            <key>NSLocalNetworkUsageDescription</key><string>RemoteHelper 需要访问本地网络，以连接局域网中的远程主机。</string>
          </dict>
          </plist>
          PLIST
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" "$bundle/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$APP_VERSION" "$bundle/Contents/Info.plist"
          plutil -lint "$bundle/Contents/Info.plist"
          codesign --force --sign - "$bundle"
          codesign --verify --strict "$bundle"
          ln -s /Applications dist/staging/Applications
          hdiutil create -volname RemoteHelper -srcfolder dist/staging -format UDZO \
            "dist/RemoteHelper-${{ matrix.target }}.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg

  publish:
    name: Publish GitHub Release
    needs: [validate-tag, build-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Prepare release notes from the changelog
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          {
            if [[ "$PRERELEASE" == true ]]; then
              printf '> 这是预发布版本，建议先在测试环境验证，再用于日常部署。\n\n'
            fi
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { found = 1; next }
              found && /^## / { exit }
              found && !/^---$/ { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md
            printf '\n完整记录见 [CHANGELOG](%s/%s/blob/%s/CHANGELOG.md)。\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > release-notes.md

      - name: Publish release and assets
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ needs.validate-tag.outputs.version }}
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          make_latest: ${{ needs.validate-tag.outputs.prerelease == 'true' && 'false' || 'true' }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/RemoteHelper-x86_64-pc-windows-msvc.exe
            dist/RemoteHelperServer-x86_64-pc-windows-msvc.zip
            dist/RemoteHelper-aarch64-apple-darwin.dmg
