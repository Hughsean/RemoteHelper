name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteHelper ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RemoteHelper ${{ steps.get_version.outputs.version }}

            � RemoteHelper v2.0.2 - macOS 窗口管理优化

            ### 🪟 修复与改进

            **macOS 窗口管理优化**
            - 点击托盘图标或菜单"显示/隐藏"时，窗口大小自动重置为 880x600
            - 窗口位置自动居中，防止窗口移出屏幕或位置异常
            - 优化用户体验，确保每次显示窗口时位置和大小一致

            ### 📝 技术细节

            - 在 macOS 上显示窗口时自动调用 `set_size()` 和 `center()`
            - 仅影响从隐藏状态恢复显示的场景
            - 不影响 Windows 和 Linux 平台

            ### 🚀 快速开始

            **首次使用**
            1. **生成密钥**: `cargo run --bin keygen`
            2. **配置**: 将公钥填入 `config.toml` 的 `authorized_keys`
            3. **启动服务端**: `cargo run --bin RemoteHelperServer`
            4. **启动客户端**: `cd app && cargo tauri dev`

            **升级用户**
            - 直接替换可执行文件即可
            - 无需配置变更，完全向后兼容

  build-tauri:
    name: Build Tauri Client
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7"

      - name: Build and Upload Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: "./app"
          args: ${{ matrix.args }}
