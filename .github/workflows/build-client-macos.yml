name: Build Client macOS

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build-tauri:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest" # ARM64
                      args: "--target aarch64-apple-darwin"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: Validate tag version and release uniqueness
              if: startsWith(github.ref, 'refs/tags/')
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const ref = context.ref;
                      const tag = ref.replace('refs/tags/', '');
                      const versionFromTag = tag.startsWith('v') ? tag.slice(1) : tag;

                      const fs = require('fs');
                      const path = require('path');
                      const configPath = path.join(process.env.GITHUB_WORKSPACE, 'client', 'src-tauri', 'tauri.conf.json');
                      const tauriConfig = JSON.parse(fs.readFileSync(configPath, 'utf8'));
                      const versionFromConfig = tauriConfig.version;

                      if (versionFromConfig !== versionFromTag) {
                          core.setFailed(`Tag version ${versionFromTag} does not match tauri.conf.json version ${versionFromConfig}`);
                          return;
                      }

                      try {
                          await github.rest.repos.getReleaseByTag({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              tag,
                          });
                          core.setFailed(`Release for tag ${tag} already exists; aborting.`);
                      } catch (error) {
                          if (error.status === 404) {
                              core.info(`No existing release for ${tag}; continuing.`);
                          } else {
                              throw error;
                          }
                      }

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

            - name: Install frontend dependencies
              working-directory: client
              run: pnpm install --no-frozen-lockfile

            - name: Build Tauri App
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: client
                  tagName: ${{ github.ref_name }}
                  releaseName: "RemoteHelper v__VERSION__"
                  releaseBody: |
                    RemoteHelper 1.0.2 (macOS only)

                    ✨ 新增
                    - 🔒 **全链路加密通信**：全面升级通信协议，引入 X25519 进行密钥交换，并结合 AES-GCM 实现会话级加密。客户端与服务器之间的所有控制指令与状态数据现已完全加密传输，大幅提升安全性。

                    🚀 改进
                    - 🎨 **界面优化**：优化了客户端仪表盘 (`index.html`) 的代码结构与界面细节，提升可读性与交互体验。
                    - ⚙️ **配置调整**：更新了默认配置文件 `config.toml`，调整了本地监听端口与 FRPC 参数示例。

                    📦 依赖变更
                    - `common` 库新增 `x25519-dalek` 与 `aes-gcm` 依赖以支持底层加密功能。

                    💡 升级提示
                    - ⚠️ **协议不兼容警告**：本次更新涉及底层通信协议的重大变更（加密握手），**必须同时更新客户端（Client）与服务器端（Server）**至 1.0.2 版本，旧版本客户端将无法连接到新版本服务器，反之亦然。
                    releaseDraft: false
                    prerelease: false
                    args: ${{ matrix.args }}
