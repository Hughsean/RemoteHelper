name: Build Client macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # ARM64
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag version and release uniqueness
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = context.ref;
            const tag = ref.replace('refs/tags/', '');
            const versionFromTag = tag.startsWith('v') ? tag.slice(1) : tag;

            const fs = require('fs');
            const path = require('path');
            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'client', 'src-tauri', 'tauri.conf.json');
            const tauriConfig = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            const versionFromConfig = tauriConfig.version;

            if (versionFromConfig !== versionFromTag) {
                core.setFailed(`Tag version ${versionFromTag} does not match tauri.conf.json version ${versionFromConfig}`);
                return;
            }

            try {
                await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag,
                });
                core.setFailed(`Release for tag ${tag} already exists; aborting.`);
            } catch (error) {
                if (error.status === 404) {
                    core.info(`No existing release for ${tag}; continuing.`);
                } else {
                    throw error;
                }
            }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: "RemoteHelper v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            RemoteHelper 1.0.5

            本次发布为 1.0.4 → 1.0.5 的维护版本，主要包含服务端性能优化与逻辑改进。

            ## 主要更新
            - **服务端性能优化**：新增空闲检测机制。当 10 秒内无客户端读取监控数据时，服务端将自动暂停硬件信息（CPU/内存/GPU）的刷新循环，显著降低待机时的资源占用。
            - **逻辑改进**：优化了后台监控任务的调度逻辑，确保在无连接状态下最小化系统开销。
            - **界面美化**：微调了客户端界面布局与样式，提升用户体验。
