<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 渐变色：蓝到绿 -->
        <linearGradient id="neon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#2dd4bf;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
        </linearGradient>

        <!-- 手绘风格滤镜：通过置换贴图产生抖动效果 -->
        <filter id="sketchy">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R"
                yChannelSelector="G" />
        </filter>

        <!-- 辉光滤镜 -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- 背景：深色圆角矩形 -->
    <rect x="20" y="20" width="472" height="472" rx="110" ry="110" fill="#0f172a" />

    <!-- 主要图形组：应用手绘滤镜 -->
    <g filter="url(#sketchy)" stroke-linecap="round" stroke-linejoin="round" fill="none">

        <!-- 外圈圆环 (封闭) -->
        <circle cx="256" cy="256" r="190"
            stroke="url(#neon-grad)"
            stroke-width="14"
            opacity="0.8" />

        <!-- 脉冲折线 -->
        <!-- 起点(60,280) -> 平移 -> 波峰 -> 波谷 -> 波峰 -> 箭头指向右上 -->
        <path
            d="M 86 280
             L 150 280
             L 190 160
             L 250 380
             L 310 200
             L 360 280
             L 420 160"
            stroke="url(#neon-grad)"
            stroke-width="18"
            filter="url(#glow)" />

        <!-- 箭头头部 -->
        <path d="M 370 160 L 420 160 L 420 210"
            stroke="url(#neon-grad)"
            stroke-width="18"
            filter="url(#glow)" />
    </g>
</svg>
