<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366f1" />
            <stop offset="100%" style="stop-color:#a855f7" />
        </linearGradient>
        <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1e293b" />
            <stop offset="100%" style="stop-color:#0f172a" />
        </linearGradient>
    </defs>

    <!-- 背景圆角矩形 - 填满整个画布 -->
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#bgGrad)" />

    <!-- 显示器外框 -->
    <rect x="10" y="12" width="44" height="30" rx="3" fill="#e2e8f0" opacity="0.95" />

    <!-- 显示器屏幕 -->
    <rect x="12" y="14" width="40" height="26" rx="2" fill="url(#screenGrad)" />

    <!-- 监控波形线 - CPU (红色) -->
    <polyline
        points="14,30 19,28 24,33 29,26 34,30 39,24 44,28 49,26 52,29"
        fill="none"
        stroke="#ff4d4d"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round" />

    <!-- 监控波形线 - 内存 (蓝色) -->
    <polyline
        points="14,35 19,34 24,36 29,33 34,35 39,32 44,34 49,33 52,35"
        fill="none"
        stroke="#3b82f6"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round" />

    <!-- 显示器支架 -->
    <rect x="28" y="42" width="8" height="4" fill="#e2e8f0" opacity="0.95" />
    <rect x="24" y="46" width="16" height="4" rx="1" fill="#e2e8f0" opacity="0.95" />

    <!-- 信号点 (表示远程连接) -->
    <circle cx="54" cy="10" r="4" fill="#10b981" />
    <circle cx="54" cy="10" r="6" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
    <circle cx="54" cy="10" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3" />
</svg>
