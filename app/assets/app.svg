<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 赛博朋克风格渐变 -->
        <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" /> <!-- Cyan -->
            <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" /> <!-- Fuchsia -->
        </linearGradient>

        <!-- 核心能量渐变 -->
        <linearGradient id="core-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>

        <!-- 强力辉光滤镜 -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- 内部阴影 -->
        <filter id="inset-shadow">
            <feOffset dx="0" dy="4" />
            <feGaussianBlur stdDeviation="4" result="offset-blur" />
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
            <feFlood flood-color="black" flood-opacity="0.5" result="color" />
            <feComposite operator="in" in="color" in2="inverse" result="shadow" />
            <feComposite operator="over" in="shadow" in2="SourceGraphic" />
        </filter>
    </defs>

    <!-- 背景：深邃的科技黑 -->
    <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="#0f172a" />

    <!-- 背景网格装饰 -->
    <path d="M 0 256 L 512 256 M 256 0 L 256 512" stroke="#1e293b" stroke-width="2" />
    <circle cx="256" cy="256" r="180" stroke="#1e293b" stroke-width="2" fill="none" />

    <!-- 主体图形组 -->
    <g transform="translate(256, 256)">

        <!-- 外层旋转轨道 (青色) -->
        <g filter="url(#glow)">
            <path d="M -225 0 A 225 225 0 0 1 225 0"
                stroke="#06b6d4" stroke-width="16" fill="none" stroke-linecap="round"
                transform="rotate(-30)" opacity="0.9" />
            <circle cx="225" cy="0" r="8" fill="#06b6d4" transform="rotate(-30)" />
        </g>

        <!-- 内层旋转轨道 (紫色) -->
        <g filter="url(#glow)">
            <path d="M -180 0 A 180 180 0 0 0 180 0"
                stroke="#d946ef" stroke-width="16" fill="none" stroke-linecap="round"
                transform="rotate(-30)" opacity="0.9" />
            <circle cx="-180" cy="0" r="8" fill="#d946ef" transform="rotate(-30)" />
        </g>

        <!-- 核心六边形护盾 -->
        <path d="M 0 -60 L 52 -30 L 52 30 L 0 60 L -52 30 L -52 -30 Z"
            fill="none" stroke="url(#cyber-grad)" stroke-width="6" opacity="0.5"
            transform="scale(2)" />

        <!-- 中心能量闪电/脉冲 -->
        <g filter="url(#glow)">
            <path d="M -15 -10 L 5 -35 L 15 -35 L -5 10 L 15 10 L -5 45 L -15 45 L 5 -10 Z"
                fill="url(#core-grad)"
                transform="scale(2.4) rotate(10)" />
        </g>

        <!-- 装饰性数据点 -->
        <circle cx="0" cy="-170" r="4" fill="#475569" />
        <circle cx="0" cy="170" r="4" fill="#475569" />
        <circle cx="-170" cy="0" r="4" fill="#475569" />
        <circle cx="170" cy="0" r="4" fill="#475569" />

    </g>
</svg>
