[application]
name = "RemoteHelper"
default_platform = "desktop"
out_dir = "dist"
asset_dir = "assets"

# 桌面应用配置
[desktop.app]
title = "RemoteHelper - 远程系统监控"

# 桌面窗口配置
[desktop.window]
resizable = true
decorations = true
transparent = false

# 打包配置
[bundle]
identifier = "dev.hughsean.remotehelper"
publisher = "Hughsean"
icon = ["assets/icon.png"]
resources = ["assets/**/*"]

# 开发服务器配置
[desktop.watcher]
watch_path = ["src", "assets"]
