# 复制为 config.toml 后，将 keygen 输出的公钥填入 authorized_keys。

[web_panel]
# enabled 控制可选的 frpc 隧道。TCP 监听始终由 local_port 决定。
enabled = false
local_port = 9999
frpc_exe_path = "frpc.exe"
frpc_args = []
authorized_keys = ["YOUR_BASE64_ENCODED_PUBLIC_KEY_HERE"]

startup_delay_secs = 0
max_connections = 100
connection_timeout_secs = 300
# health_check_url = "https://example.com"

# 如需 frpc 隧道，将 enabled 改为 true 并填写 frpc_exe_path 和 frpc_args。
# 请将包含实际凭据的 config.toml 留在本地。

# 可以定义多个服务。路径和参数由远程 Windows 主机解释。
# [[service]]
# description = "备份程序"
# exe_path = "C:/Tools/backup.exe"
# args = ["--quiet"]
# auto_start 可设为 none、oneshot 或 continuous。
# auto_start = "none"
# allow_web_control 控制是否允许桌面客户端远程操作。
# allow_web_control = true
