<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 背景径向渐变：营造深邃空间感 -->
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
        </radialGradient>

        <!-- 青色轨道渐变：模拟拖尾效果 -->
        <linearGradient id="cyan-trail" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
        </linearGradient>

        <!-- 紫色轨道渐变：模拟拖尾效果 -->
        <linearGradient id="purple-trail" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#e879f9;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
        </linearGradient>

        <!-- 核心闪电渐变：高亮能量感 -->
        <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="40%" style="stop-color:#60a5fa;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
        </linearGradient>

        <!-- 柔和辉光 -->
        <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- 强力核心辉光 -->
        <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="blur" /> <!-- 双重叠加增强亮度 -->
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- 背景 -->
    <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg-grad)" />

    <!-- 装饰网格 (更精致) -->
    <path d="M 256 40 L 256 472 M 40 256 L 472 256" stroke="#334155" stroke-width="1" opacity="0.2" />
    <circle cx="256" cy="256" r="190" stroke="#334155" stroke-width="1" fill="none" opacity="0.2"
        stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="130" stroke="#334155" stroke-width="1" fill="none" opacity="0.1" />

    <!-- 主体图形组 -->
    <g transform="translate(256, 256) scale(1.3)">

        <!-- 外层轨道 (青色) - 顺时针 -->
        <g filter="url(#soft-glow)">
            <!-- 轨道本体 -->
            <path d="M -150 0 A 150 150 0 0 1 150 0"
                stroke="url(#cyan-trail)" stroke-width="14" fill="none" stroke-linecap="round"
                transform="rotate(-45)" />
            <!-- 头部高亮粒子 -->
            <circle cx="150" cy="0" r="7" fill="#cffafe" transform="rotate(-45)" />
        </g>

        <!-- 内层轨道 (紫色) - 逆时针 -->
        <g filter="url(#soft-glow)">
            <path d="M -110 0 A 110 110 0 0 0 110 0"
                stroke="url(#purple-trail)" stroke-width="14" fill="none" stroke-linecap="round"
                transform="rotate(135)" />
            <circle cx="-110" cy="0" r="7" fill="#fae8ff" transform="rotate(135)" />
        </g>

        <!-- 核心六边形底座 -->
        <path d="M 0 -75 L 65 -37.5 L 65 37.5 L 0 75 L -65 37.5 L -65 -37.5 Z"
            fill="#0f172a" stroke="#3b82f6" stroke-width="2" opacity="0.9" />

        <!-- 内部科技线条装饰 -->
        <path d="M 0 -60 L 0 -40 M 0 60 L 0 40 M -52 -30 L -35 -20 M 52 30 L 35 20"
            stroke="#3b82f6" stroke-width="2" opacity="0.5" />

        <!-- 中心闪电 (更具动感) -->
        <g filter="url(#core-glow)">
            <path d="M -12 -25 L 25 -60 L 35 -60 L 5 10 L 25 10 L -15 65 L -25 65 L 0 -25 Z"
                fill="url(#bolt-grad)"
                transform="scale(1.1)" />
        </g>

        <!-- 右下角装饰：运行状态指示 -->
        <g filter="url(#soft-glow)">
            <!-- 外部大弧线 -->
            <path d="M 50 160 A 180 180 0 0 0 160 50" stroke="#10b981" stroke-width="1" fill="none"
                opacity="0.3" />

            <!-- 主要虚线弧 -->
            <path d="M 80 140 A 160 160 0 0 0 150 70" stroke="#10b981" stroke-width="5"
                stroke-linecap="round" fill="none" opacity="0.8" stroke-dasharray="20 10" />

            <!-- 装饰点 -->
            <circle cx="125" cy="125" r="6" fill="#10b981" />
            <circle cx="145" cy="105" r="3" fill="#10b981" opacity="0.6" />

            <!-- 数据流点阵 -->
            <circle cx="95" cy="135" r="2" fill="#34d399" opacity="0.4" />
            <circle cx="105" cy="125" r="3" fill="#34d399" opacity="0.6" />
            <circle cx="115" cy="115" r="4" fill="#34d399" opacity="0.8" />

            <!-- 新增：能量槽刻度 -->
            <line x1="135" y1="135" x2="155" y2="155" stroke="#34d399" stroke-width="3"
                stroke-linecap="round" opacity="0.3" />
            <line x1="125" y1="145" x2="145" y2="165" stroke="#34d399" stroke-width="3"
                stroke-linecap="round" opacity="0.5" />
            <line x1="115" y1="155" x2="135" y2="175" stroke="#34d399" stroke-width="3"
                stroke-linecap="round" opacity="0.2" />

            <!-- 新增：连接线 -->
            <line x1="40" y1="40" x2="80" y2="80" stroke="#10b981" stroke-width="1" opacity="0.3"
                stroke-dasharray="4 4" />
        </g>

        <!-- 四周装饰点 -->
        <g fill="#94a3b8" opacity="0.5">
            <circle cx="0" cy="-170" r="3" />
            <circle cx="0" cy="170" r="3" />
            <circle cx="-170" cy="0" r="3" />
            <circle cx="170" cy="0" r="3" />
        </g>

    </g>
</svg>
