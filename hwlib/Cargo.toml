# [workspace]
# resolver = "2"
# members = [
#     "lhm-core",
#     "lhm-driver",
#     "lhm-cpu",
#     "lhm-motherboard",
#     "lhm-cli",
# ]

[package]
name = "hwlib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Hardware Library for LHM"

[dependencies]
# Windows API
windows = { version = "0.62" }
winapi = { version = "0.3", features = [
  "errhandlingapi",
  "fileapi",
  "handleapi",
  "ioapiset",
  "processthreadsapi",
  "securitybaseapi",
  "sysinfoapi",
  "winsvc",
] }

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
toml.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# CPU identification
raw-cpuid = { version = "11.6" }

# Hash verification
sha2.workspace = true

# CLI
clap = { version = "4.5", features = ["derive"] }


common.workspace = true

[[bin]]
name = "cli"
path = "src/bin/cli.rs"
