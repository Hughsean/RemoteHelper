[workspace]
members = ["common", "client/src-tauri"]
[workspace.package]
version = "1.0.4"
authors = ["Hughsean<Hughsean.F@outlook.com>"]
edition = "2024"
license = "MIT"
# repository = "https://github.com/your/repo"
publish = false # 默认不发布，需要的子模块再覆盖



[package]
name = "RemoteHelperServer"
# version = "1.0.4"
# edition = "2024"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]
nvml-wrapper = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sysinfo = "0.37.2"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
common = { path = "common" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0"
base64 = "0.22.1"
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
sha2 = "0.10.9"
tracing-appender = "0.2.4"
# tokio-rustls = "0.26.4"
# rustls = "0.23.35"
rcgen = "0.14.6"
anyhow = "1.0.100"
x25519-dalek = "2.0.1"
