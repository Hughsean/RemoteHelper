[workspace]
resolver = "3"
members = ["crates/*"]
# 保留从仓库根目录执行 Cargo 命令时的默认服务端目标。
default-members = ["crates/server"]

[workspace.package]
version = "3.0.0-rc.1"
authors = ["Hughsean<Hughsean.F@outlook.com>"]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
clap = "4.5"
crc32c = "0.6"
dirs = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
embed-resource = "3"
gpui-kit = "=0.11.0"
hmac = "0.13"
libc = "0.2"
log = "0.4"
nvml-wrapper = "0.12"
rand = "0.10"
rand_core = "0.10"
raw-cpuid = "11.6"
raw-window-handle = "0.6"
reqwest = "0.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysinfo = "0.38"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "time",
  "local-time",
] }
winapi = "0.3"
windows = "0.62"
windows-sys = "0.61"
x25519-dalek = "2.0"
zstd = "0.13"

# 工作区内部依赖
client = { path = "crates/client" }
common = { path = "crates/common" }
history = { path = "crates/history" }
hwlib = { path = "crates/hwlib" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
